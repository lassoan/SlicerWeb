# Publish a SlicerWeb application. Deployments call this workflow (docs/extensions.md): the
# published application, https://lassoan.github.io/slicerweb-app/ (lassoan/slicerweb-app), and
# others such as the SlicerHeart web viewer. Each says which extensions its build has, and its
# "Publish app" workflow calls this one: the runtime then comes from a release of that repository,
# and the site goes where it says - a branch of that repository itself, deploy/<channel>.
#
# A change of the web application here (a push to web/) publishes lassoan/slicerweb-app again
# straight away, with the runtime of its runtime-latest release, to its branch deploy/latest (where
# GitHub Pages serves it from). That needs a way to write to it: the secret SLICERWEB_APP_KEY, the
# private half of a deploy key of that repository, or else SLICERWEB_APP_TOKEN, a token that may
# write to it.
#
# The site is a few hundred megabytes of WebAssembly, wheels and sample data, rebuilt whenever the
# web application changes: it is pushed as a single commit that replaces what was there before, so
# the branch holds one build and no history. What it is made of:
#  - the web application, built here from web/
#  - the WebAssembly runtime (VTK, ITK, Slicer libraries and modules, extensions), which takes hours
#    to compile and cannot be built by a runner: it is downloaded from a release of the deployment,
#    uploaded from a local build with scripts/publish_runtime.py
#  - the sample data, copied into the site because a site of static files cannot fetch files from
#    servers that refuse cross-origin requests (web/scripts/mirror-sample-data.mjs)

name: Publish app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/publish-app.yml"
  workflow_call:
    inputs:
      appRepository:
        description: Repository the site is pushed to
        type: string
        required: true
      appBranch:
        description: Branch of it that holds the site (replaced by each build)
        type: string
        default: main
      runtimeRepository:
        description: Repository whose release holds the runtime wheels (the calling one if empty)
        type: string
        default: ""
      runtime:
        description: Release holding the runtime wheels
        type: string
        default: runtime
      sampleData:
        description: Copy the sample data into the site
        type: boolean
        default: true
      slicerwebRepository:
        description: SlicerWeb repository whose web application is built
        type: string
        default: lassoan/SlicerWeb
      slicerwebRef:
        description: Branch, tag or commit of it
        type: string
        default: main
      downloadProxy:
        description: Download proxy for files of servers that refuse cross-origin requests (see download-proxy/worker.js; the repository variable SLICERWEB_DOWNLOAD_PROXY if empty)
        type: string
        default: ""
    secrets:
      SLICERWEB_APP_KEY:
        required: false
      SLICERWEB_APP_TOKEN:
        required: false
      RUNTIME_TOKEN:
        description: Token that may read the runtime release (the workflow's own token if not given)
        required: false
  workflow_dispatch:
    inputs:
      runtime:
        description: Release of lassoan/slicerweb-app holding the runtime wheels
        default: runtime-latest
      slicerwebRef:
        description: Commit of SlicerWeb whose web application is built (the one the runtime was built from; publish_runtime.py gives it)
        default: ""
      sampleData:
        description: Copy the sample data into the site
        type: boolean
        default: true

# A newer build of a site replaces one still being published to the same place; builds of other
# places - another channel of a deployment (deploy/latest, deploy/stable) - go on side by side.
concurrency:
  group: publish-app-${{ inputs.appRepository || 'lassoan/slicerweb-app' }}-${{ inputs.appBranch || 'deploy/latest' }}
  cancel-in-progress: true

env:
  # Called by a deployment: where it says (its own repository unless it names another). Run here (a
  # push to web/): lassoan/slicerweb-app, its latest channel.
  APP_REPOSITORY: ${{ inputs.appRepository || 'lassoan/slicerweb-app' }}
  APP_BRANCH: ${{ inputs.appBranch || 'deploy/latest' }}
  RUNTIME_REPOSITORY: ${{ inputs.runtimeRepository || (inputs.appRepository && github.repository) || 'lassoan/slicerweb-app' }}
  RUNTIME_RELEASE: ${{ inputs.runtime || 'runtime-latest' }}
  SLICERWEB_WHEELS: ${{ github.workspace }}/runtime/wheels
  SLICERWEB_EXTENSIONS: ${{ github.workspace }}/runtime/extensions
  SLICERWEB_SAMPLE_DATA: ${{ github.workspace }}/runtime/sample-data
  # The published site is static files only, so it has no download proxy of its own: files of
  # servers that refuse cross-origin requests are fetched through the one given here - a Cloudflare
  # Worker, download-proxy/worker.js, published with scripts/publish_download_proxy.py - and where
  # none is given, through none ("0"), as asking for one that is not there would turn a clear
  # failure into a confusing one. The development server keeps its own proxy.
  VITE_DOWNLOAD_PROXY: ${{ inputs.downloadProxy || vars.SLICERWEB_DOWNLOAD_PROXY || '0' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # (github.repository is the calling repository when this workflow is called from another one)
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.slicerwebRepository || github.repository }}
          ref: ${{ inputs.slicerwebRef || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Take the runtime from the ${{ env.RUNTIME_RELEASE }} release
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_TOKEN || github.token }}
        run: |
          mkdir -p runtime
          gh release download "$RUNTIME_RELEASE" --repo "$RUNTIME_REPOSITORY" --dir runtime --clobber
          unzip -q runtime/wheels.zip -d "$SLICERWEB_WHEELS"
          unzip -q runtime/extensions.zip -d "$SLICERWEB_EXTENSIONS"
          ls -la "$SLICERWEB_WHEELS" "$SLICERWEB_EXTENSIONS"

      # Sample data is large and rarely changes, so a build starts from what the last one downloaded
      # and fetches only what is missing.
      - name: Sample data downloaded earlier
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sampleData }}
        uses: actions/cache@v4
        with:
          path: ${{ env.SLICERWEB_SAMPLE_DATA }}
          key: sample-data-${{ github.run_id }}
          restore-keys: sample-data-

      - name: Install
        working-directory: web
        run: npm ci

      - name: Sample data of the Samples menu
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sampleData }}
        working-directory: web
        run: node scripts/fetch-sample-data.mjs

      - name: Build
        working-directory: web
        run: npm run build

      # Which sample data sets exist is known only to a running application - modules and extensions
      # register them as they load - so the built site is served here and asked.
      - name: Copy the sample data of every module into the site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sampleData }}
        working-directory: web
        run: |
          npx vite preview --port 4173 --strictPort &
          preview=$!
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break || sleep 2; done
          node scripts/mirror-sample-data.mjs http://localhost:4173/ "$SLICERWEB_SAMPLE_DATA"
          mkdir -p dist/app/sample-data
          cp -r "$SLICERWEB_SAMPLE_DATA"/. dist/app/sample-data/
          kill $preview || true

      - name: Size of the site
        working-directory: web/dist/app
        run: |
          du -sh . */ | sort -h
          # GitHub refuses a file above 100 MB, and asks a Pages site to stay under a gigabyte.
          large=$(find . -type f -size +100M) && [ -z "$large" ] || { echo "Too large to publish:"; echo "$large"; exit 1; }

      - name: Push the site to ${{ env.APP_REPOSITORY }}
        working-directory: web/dist/app
        env:
          KEY: ${{ secrets.SLICERWEB_APP_KEY }}
          TOKEN: ${{ secrets.SLICERWEB_APP_TOKEN }}
          # A site pushed to a branch of the repository that runs the workflow needs no key: the
          # workflow's own token may write there, if the calling workflow grants "contents: write".
          OWN_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ] && [ -z "$TOKEN" ] && [ "$APP_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then TOKEN=$OWN_TOKEN; fi
          if [ -n "$KEY" ]; then
            mkdir -p ~/.ssh && umask 077 && printf '%s\n' "$KEY" > ~/.ssh/publish
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            remote="git@github.com:$APP_REPOSITORY.git"
          elif [ -n "$TOKEN" ]; then
            remote="https://x-access-token:$TOKEN@github.com/$APP_REPOSITORY.git"
          else
            echo "Neither SLICERWEB_APP_KEY nor SLICERWEB_APP_TOKEN is set"; exit 1
          fi
          # the commit of SlicerWeb built (GITHUB_SHA is that of the calling repository, when called)
          SLICERWEB_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          touch .nojekyll   # otherwise GitHub Pages hides files whose name starts with an underscore
          cat > README.md <<READ
          # ${APP_REPOSITORY##*/}

          The published [SlicerWeb](https://github.com/lassoan/SlicerWeb) application.

          Every file here is built, and this branch holds one build and no history - each build
          replaces the last one. Nothing here is edited by hand; the source is in the SlicerWeb
          repository, and the build is \`.github/workflows/publish-app.yml\` there.
          READ
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$remote"
          # What the site repository already holds, without the files themselves: the commit here
          # has no parent, so it replaces the last build - but knowing what is there already means
          # only the files that changed are uploaded, not the half a gigabyte of sample data again.
          git fetch --depth 1 --filter=blob:none origin "$APP_BRANCH" || echo "Nothing published yet"
          git add -A
          git commit -qm "SlicerWeb ${SLICERWEB_COMMIT}: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          # One commit and no history: the site repository holds this build alone.
          git push --force --quiet origin "HEAD:$APP_BRANCH" || {
            echo "Pushing what changed did not work; uploading the whole site"
            rm -rf .git
            git init -q -b main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -qm "SlicerWeb ${SLICERWEB_COMMIT}: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
            git push --force --quiet "$remote" "HEAD:$APP_BRANCH"
          }
          echo "Published https://${APP_REPOSITORY%%/*}.github.io/${APP_REPOSITORY##*/}/" >> "$GITHUB_STEP_SUMMARY"
